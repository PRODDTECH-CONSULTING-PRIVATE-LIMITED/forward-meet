<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midway Place Finder</title>

    <!-- This <script> will be replaced by Vite -->
    <!-- Google Maps Platform Components -->
    <gmpx-api-loader id="api-loader" v="beta" libraries="places,marker"></gmpx-api-loader>
    <script type="module">
      const apiKey = import.meta.env.VITE_GOOGLE_MAPS_API_KEY;
      const loader = document.getElementById('api-loader');
      if (loader) loader.setAttribute('key', apiKey);
    </script>
    <script type="module" src="https://unpkg.com/@googlemaps/extended-component-library@0.6.14/dist/index.min.js"></script>

    <!-- Optional: Hide 'Open in Maps' button -->
    <style>
      gmpx-button[aria-label="Open in Maps"],
      gmpx-button[aria-label="View on Google Maps"],
      .gmpx-open-in-maps-button {
        display: none !important;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f9fafb;
      }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
